name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC
            os: depot-ubuntu-24.04-4
            cc: gcc-14
            cxx: g++-14
          - name: Linux / Clang
            os: depot-ubuntu-24.04-4
            cc: clang-18
            cxx: clang++-18
          - name: macOS / AppleClang
            os: depot-macos-26
            cc: clang
            cxx: clang++
          - name: Windows / MSVC
            os: depot-windows-2022-4
            cc: cl
            cxx: cl

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build catch2 ${{ matrix.cc }} ${{ matrix.cxx }}

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja catch2

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
          key: ${{ matrix.name }}

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON
          -DBUILD_REPL=ON
          -DBUILD_REPL_CURRENCY_PROVIDER=OFF
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_C_COMPILER_LAUNCHER=${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
